name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command or code, plus the image if you can share it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `edgedefectnet-predict --version` or `python -m edgedefectnet.predict --version`
  - type: input
    id: env
    attributes:
      label: Python and OS
      placeholder: Python 3.12, Ubuntu 24.04
