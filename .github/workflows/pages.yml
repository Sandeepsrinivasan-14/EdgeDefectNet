name: Web app (GitHub Pages)

# Builds the static web app (web/ + model + examples + metrics) on every push and pull request, and deploys it to
# GitHub Pages from the default branch.
#
# One-time repository setting: Settings > Pages > Build and deployment > Source: "GitHub Actions"
# (or: gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow).
# If Pages is not enabled the workflow still builds the site, ends with a clear warning and skips the deploy
# instead of failing with an HTTP 404 from actions/deploy-pages.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - "models/**"
      - "examples/**"
      - "reports/metrics_test.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # lets the preflight check read the Pages configuration
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python scripts/build_site.py _site
      - name: Check the site is complete
        run: |
          for f in index.html app.js style.css model.onnx metrics.json examples/index.json; do
            test -s "_site/$f" || { echo "::error::_site/$f is missing or empty"; exit 1; }
          done
          du -sh _site
      - name: Decide whether to deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT_REF" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Build-only run ($REF is not the default branch); nothing is deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if out=$(gh api "repos/${{ github.repository }}/pages" 2>&1); then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "Not Found"; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Site built successfully but not deployed. Enable Pages: Settings > Pages > Source: GitHub Actions."
            {
              echo "### GitHub Pages is not enabled"
              echo "The site was built but not deployed. One-time fix: **Settings > Pages > Build and deployment > Source: GitHub Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not query the Pages configuration: $out"
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
