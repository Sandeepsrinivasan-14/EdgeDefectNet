name: Release

# Push a tag such as v2.1.0 to publish a GitHub Release containing the wheel, the sdist, the ONNX model and its
# SHA-256. The tag must match edgedefectnet.__version__ so a release can never ship the wrong version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tag must match the package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('edgedefectnet/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match edgedefectnet.__version__ ($version)"
            exit 1
          fi
      - run: pip install -e ".[dev,demo]"
      - run: pytest -q
      - name: Build artefacts
        run: |
          python -m build
          twine check --strict dist/*
          cp models/edgedefectnet.onnx models/edgedefectnet.onnx.sha256 dist/
          (cd dist && sha256sum -c edgedefectnet.onnx.sha256)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
